name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntaxe de investissements.js
        run: node --check app/investissements.js
      - name: Calculs financiers
        run: node --test tests/*.test.js

  parcours:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # un téléchargement du navigateur bloqué ne doit pas tourner des heures
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Chrome est déjà sur les machines GitHub : pas de téléchargement du navigateur (il restait parfois bloqué)
      - name: Parcours dans un navigateur (réseau simulé)
        run: npm test
        env:
          PW_CANAL: chrome
